[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patent-kg-agent"
version = "0.1.0"
description = "A patent knowledge graph and Agentic RAG project for Chinese patent documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "markdown-it-py>=3.0.0",
  "rank-bm25>=0.2.2",
  "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
llm = [
  "openai>=1.40.0",
  "langgraph>=0.2.0",
]
vector = [
  "chromadb>=0.5.0",
]
graph = [
  "neo4j>=5.22.0",
]
eval = [
  "ragas>=0.1.0",
  "deepeval>=0.21.0",
]
ui = [
  "streamlit>=1.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patent_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["patent_rag"]
strict = true
